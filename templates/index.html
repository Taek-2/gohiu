<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍익대학교 합격 예측</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --hongik-blue: #1833DB;
            --hongik-blue-hover: #142db8;
        }
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .container {
            max-width: 800px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-container img {
            height: auto;
            max-width: 90%;
            width: auto;
            margin-bottom: 1.5rem;
        }
        .main-title {
            font-weight: 700;
            color: var(--hongik-blue);
            margin-bottom: 2rem;
            text-align: center;
            font-size: min(1.5rem, 4vw);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .form-control, .form-select {
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--hongik-blue);
            box-shadow: 0 0 0 0.2rem rgba(24, 51, 219, 0.25);
        }
        .btn-primary {
            background-color: var(--hongik-blue);
            border-color: var(--hongik-blue);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--hongik-blue-hover);
            border-color: var(--hongik-blue-hover);
        }
        .result-box {
            display: none;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .probability-gauge {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .probability-fill {
            height: 100%;
            transition: width 0.5s ease-in-out;
        }
        .message {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .footer {
            margin-top: 3rem;
            padding: 1rem 0;
            border-top: 1px solid #dee2e6;
            color: #6c757d;
            font-size: 0.875rem;
            text-align: center;
        }
        .footer p {
            margin-bottom: 0.3rem;
        }
        .footer a {
            color: var(--hongik-blue);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .form-section {
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .form-section h5 {
            color: var(--hongik-blue);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://www.hongik.ac.kr/_res/hongik/_share/etc/img-logo-on.svg" alt="홍익대학교 로고">
            <h1 class="main-title">2025학년도 수능우수자전형 다군 합격예측</h1>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form id="predictionForm">
                    <div class="form-section">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="track" class="form-label">계열 선택</label>
                                <select class="form-select" id="track" required>
                                    <option value="">계열을 선택하세요</option>
                                    <option value="humanities">인문계열</option>
                                    <option value="sciences">자연계열</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="department" class="form-label">지원 학과</label>
                                <select class="form-select" id="department" required disabled>
                                    <option value="">학과를 선택하세요</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h5>수능 성적 입력</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="korean" class="form-label">국어 표준점수</label>
                                <input type="number" class="form-control" id="korean" required min="0" max="200">
                            </div>
                            <div class="col-md-4">
                                <label for="math" class="form-label">수학 표준점수</label>
                                <input type="number" class="form-control" id="math" required min="0" max="200">
                            </div>
                            <div class="col-md-4">
                                <label for="english" class="form-label">영어 등급</label>
                                <select class="form-select" id="english" required>
                                    <option value="">등급 선택</option>
                                    {% for grade in range(1, 10) %}
                                    <option value="{{ grade }}">{{ grade }}등급</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <label for="history" class="form-label">한국사 등급</label>
                                <select class="form-select" id="history" required>
                                    <option value="">등급 선택</option>
                                    {% for grade in range(1, 10) %}
                                    <option value="{{ grade }}">{{ grade }}등급</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="select1" class="form-label" id="select1Label">탐구1 표준점수</label>
                                <input type="number" class="form-control" id="select1" required min="0" max="200">
                            </div>
                            <div class="col-md-4">
                                <label for="select2" class="form-label" id="select2Label">탐구2 표준점수</label>
                                <input type="number" class="form-control" id="select2" required min="0" max="200">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">예측하기</button>
                </form>
            </div>
        </div>

        <div id="resultBox" class="result-box">
            <h4 class="text-center">예측 결과</h4>
            <p class="text-center">모집단위: <span id="selectedDepartment"></span></p>
            <p class="text-center">홍익대 환산 총점: <span id="totalScore">0</span></p>
            <p class="text-center message" id="message"></p>
            <div class="probability-gauge">
                <div id="probabilityFill" class="probability-fill" style="width: 0%"></div>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-secondary" onclick="resetForm()">다시 예측하기</button>
            </div>
        </div>

        <footer class="footer">
            <p>본 합격예측 서비스는 참고용으로만 사용하시기 바랍니다.</p>
            <p>실제 입시 결과는 본 예측과 다를 수 있으며, 이에 대해 어떠한 책임도 지지 않습니다.</p>
            <p>정확한 입시 정보는 반드시 홍익대학교 입학처 공식 홈페이지를 참고하시기 바랍니다.</p>
            <p><a href="https://open.kakao.com/o/sGX5voag" target="_blank">제작자 문의</a></p>
        </footer>
    </div>

    <script>
        const trackSelect = document.getElementById('track');
        const departmentSelect = document.getElementById('department');
        const select1Label = document.getElementById('select1Label');
        const select2Label = document.getElementById('select2Label');

        trackSelect.addEventListener('change', function() {
            departmentSelect.disabled = false;
            departmentSelect.innerHTML = '<option value="">학과를 선택하세요</option>';
            
            if (this.value === 'humanities') {
                {% for dept in humanities %}
                    departmentSelect.innerHTML += `<option value="{{ dept }}">{{ dept }}</option>`;
                {% endfor %}
                select1Label.textContent = '탐구1 표준점수';
                select2Label.textContent = '탐구2 표준점수';
            } else if (this.value === 'sciences') {
                {% for dept in sciences %}
                    departmentSelect.innerHTML += `<option value="{{ dept }}">{{ dept }}</option>`;
                {% endfor %}
                select1Label.textContent = '과학탐구1 표준점수';
                select2Label.textContent = '과학탐구2 표준점수';
            }
        });

        function resetForm() {
            document.getElementById('predictionForm').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('predictionForm').reset();
            departmentSelect.disabled = true;
        }

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                department: document.getElementById('department').value,
                korean: document.getElementById('korean').value,
                math: document.getElementById('math').value,
                english: document.getElementById('english').value,
                history: document.getElementById('history').value,
                select1: document.getElementById('select1').value,
                select2: document.getElementById('select2').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                document.getElementById('selectedDepartment').textContent = document.getElementById('department').options[document.getElementById('department').selectedIndex].text;
                document.getElementById('totalScore').textContent = result.total_score;
                document.getElementById('message').textContent = result.message;
                document.getElementById('message').style.color = result.color;
                
                const probabilityFill = document.getElementById('probabilityFill');
                probabilityFill.style.width = `${result.probability}%`;
                probabilityFill.style.backgroundColor = result.color;
                
                document.getElementById('predictionForm').style.display = 'none';
                document.getElementById('resultBox').style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('예측 중 오류가 발생했습니다.');
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
